<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center p-6 md:p-10">
<div class="w-full max-w-7xl bg-surface-container-low rounded-xl shadow-xl p-8 md:p-14 flex flex-col justify-between gap-12">
<!-- 1) TOP HEADER -->
<div class="flex items-center gap-5">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shrink-0 shadow-md">
<span class="font-display-lg text-display-lg text-on-surface">2</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-wide">
        CHOOSE YOUR ROLE
      </h1>
</div>
<!-- 2) CENTER HEADING & 3) TWO HORIZONTAL ROLE CARDS -->
<div class="flex flex-col items-center gap-10 my-4">
<h2 class="font-display-lg text-display-lg text-on-surface text-center">
        Choose your role
      </h2>
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8" id="role-cards-container">
<!-- CARD 1 (LEFT, default selected) -->
<button class="role-card group relative flex items-center gap-6 p-8 md:p-10 rounded-xl bg-surface-container-highest shadow-xl text-left transition-all duration-200 cursor-pointer overflow-hidden" data-role="Operator" data-selected="true" type="button">
<span class="selection-bar absolute left-0 top-0 bottom-0 w-2 bg-primary-container transition-opacity duration-200 opacity-100"></span>
<div class="shrink-0 w-20 h-20 flex items-center justify-center text-primary-container">
<svg aria-hidden="true" class="w-16 h-16" fill="none" viewbox="0 0 64 64">
<path d="M14 34C14 23.5066 22.0589 15 32 15C41.9411 15 50 23.5066 50 34H14Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-linejoin="round" stroke-width="3.5"></path>
<path d="M27 15V11C27 9.89543 27.8954 9 29 9H35C36.1046 9 37 9.89543 37 11V15" stroke="currentColor" stroke-linecap="round" stroke-width="3.5"></path>
<path d="M10 34H54C55.1046 34 56 34.8954 56 36C56 37.1046 55.1046 38 54 38H10C8.89543 38 8 37.1046 8 36C8 34.8954 8.89543 34 10 34Z" fill="currentColor"></path>
<path d="M20 42C20 48.6274 25.3726 54 32 54C38.6274 54 44 48.6274 44 42" stroke="currentColor" stroke-linecap="round" stroke-width="3.5"></path>
</svg>
</div>
<div class="flex flex-col gap-2 min-w-0">
<span class="font-headline-lg text-headline-lg text-on-surface">
              Operator
            </span>
<span class="font-body-lg text-body-lg text-on-surface/80">
              Report machine issues and safety risks.
            </span>
</div>
</button>
<!-- CARD 2 (RIGHT, unselected) -->
<button class="role-card group relative flex items-center gap-6 p-8 md:p-10 rounded-xl bg-surface-container shadow-md text-left transition-all duration-200 cursor-pointer overflow-hidden hover:bg-surface-container-high" data-role="Quality Inspector" data-selected="false" type="button">
<span class="selection-bar absolute left-0 top-0 bottom-0 w-2 bg-primary-container transition-opacity duration-200 opacity-0"></span>
<div class="shrink-0 w-20 h-20 flex items-center justify-center text-tertiary-container">
<svg aria-hidden="true" class="w-16 h-16" fill="none" viewbox="0 0 64 64">
<path d="M32 8L12 16V30C12 43.2 20.5 54.4 32 58C43.5 54.4 52 43.2 52 30V16L32 8Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-linejoin="round" stroke-width="3.5"></path>
<path d="M23 32L29 38L41 26" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
</svg>
</div>
<div class="flex flex-col gap-2 min-w-0">
<span class="font-headline-lg text-headline-lg text-on-surface">
              Quality Inspector
            </span>
<span class="font-body-lg text-body-lg text-on-surface/80">
              Report production quality data.
            </span>
</div>
</button>
</div>
</div>
<!-- 4) CONTINUE BUTTON -->
<div class="flex justify-end pt-4">
<button class="w-full md:w-80 h-20 bg-primary-container text-on-surface font-headline-md text-headline-md rounded-xl shadow-lg flex items-center justify-center gap-3 hover:opacity-90 active:scale-[0.99] transition-all duration-150 cursor-pointer" id="continue-btn" type="button">
<span>Continue</span>
<span aria-hidden="true">→</span>
</button>
</div>
</div>
</div>
<script>
  (function () {
    const cards = document.querySelectorAll('.role-card');
    const continueBtn = document.getElementById('continue-btn');
    let selectedRole = 'Operator';

    function selectCard(targetCard) {
      cards.forEach((card) => {
        const isTarget = card === targetCard;
        const bar = card.querySelector('.selection-bar');

        card.setAttribute('data-selected', isTarget ? 'true' : 'false');

        if (isTarget) {
          card.classList.remove('bg-surface-container', 'shadow-md', 'hover:bg-surface-container-high');
          card.classList.add('bg-surface-container-highest', 'shadow-xl');
          if (bar) {
            bar.classList.remove('opacity-0');
            bar.classList.add('opacity-100');
          }
          selectedRole = card.getAttribute('data-role');
        } else {
          card.classList.remove('bg-surface-container-highest', 'shadow-xl');
          card.classList.add('bg-surface-container', 'shadow-md', 'hover:bg-surface-container-high');
          if (bar) {
            bar.classList.remove('opacity-100');
            bar.classList.add('opacity-0');
          }
        }
      });
    }

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        selectCard(card);
      });
    });

    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        try {
          sessionStorage.setItem('dryftq_selected_role', selectedRole);
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('dryftq:role-selected', { detail: { role: selectedRole } }));
      });
    }
  })();
</script></main></body></html>
